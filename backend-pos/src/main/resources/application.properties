spring.application.name=backend-pos
server.port=${SERVER_PORT:8080}

# Quiet, operator-focused terminal output. Application messages below provide API/Mongo readiness
# and HttpRequestLogFilter produces one compact line per REST request.
spring.main.banner-mode=off
spring.output.ansi.enabled=always
logging.pattern.console=%d{HH:mm:ss} %clr(%-5level){faint} %msg%n
logging.level.root=WARN
logging.level.tn.cafe.pos=INFO
logging.level.org.springframework.boot.autoconfigure.mongo=WARN
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springdoc=ERROR
logging.level.org.mongodb.driver=WARN
logging.level.com.mongodb=WARN
logging.level.org.apache.catalina=WARN

# MongoDB (Boot 4: connexion = spring.mongodb.*, mapping = spring.data.mongodb.*)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pos_tunisie}
spring.mongodb.database=${MONGODB_DATABASE:pos_tunisie}
spring.data.mongodb.auto-index-creation=true

# JWT
app.jwt.secret=${JWT_SECRET:change-me-please-generate-256-bit-secret-min-32-chars!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Compte gérant par défaut
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123@}
app.admin.pin=${ADMIN_PIN:1234}
app.admin.qr-key=${ADMIN_QR_KEY:ADMIN-QR-KEY-CHANGE-ME}

# Tickets / imprimante (simulation)
app.printer.enabled=${PRINTER_ENABLED:true}
app.printer.name=${PRINTER_NAME:POS-58mm}
app.ticket.width-mm=${TICKET_WIDTH_MM:58}
app.ticket.currency=${TICKET_CURRENCY:TND}
app.ticket.locale=${TICKET_LOCALE:fr-TN}
app.ticket.footer=${TICKET_FOOTER:Merci de votre visite !}

# Paiement simulé
app.payment.simulation-mode=${PAYMENT_SIMULATION_MODE:true}
app.payment.proximity-auto-confirm=${PROXIMITY_AUTO_CONFIRM:true}

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
