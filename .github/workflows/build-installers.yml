name: Build POS installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            type: deb
            artifact: pos-tunisie-linux
            icon: assets/pos-tunisie-logo.png
          - os: windows-2025
            type: exe
            artifact: pos-tunisie-windows
            icon: assets/pos-tunisie-logo.ico
          - os: macos-14
            type: dmg
            artifact: pos-tunisie-macos
            icon: assets/pos-tunisie-logo.icns

    defaults:
      run:
        working-directory: desktop-pos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build desktop application
        run: ./mvnw -q -DskipTests package dependency:copy-dependencies -DoutputDirectory=target/installer-input

      - name: Build bundled backend
        working-directory: backend-pos
        run: ./mvnw -q -DskipTests package

      - name: Download bundled MongoDB (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MONGO_URL: ${{ runner.os == 'macOS' && 'https://fastdl.mongodb.org/osx/mongodb-macos-arm64-8.0.4.tgz' || 'https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.0.4.tgz' }}
        run: |
          curl --fail --silent --show-error --location "$MONGO_URL" -o /tmp/mongodb.tgz
          mkdir -p /tmp/mongodb
          tar -xzf /tmp/mongodb.tgz -C /tmp/mongodb --strip-components=1
          cp /tmp/mongodb/bin/mongod target/installer-input/

      - name: Download bundled MongoDB (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-8.0.4.zip' -OutFile "$env:TEMP\mongodb.zip"
          Expand-Archive -Path "$env:TEMP\mongodb.zip" -DestinationPath "$env:TEMP\mongodb" -Force
          Copy-Item (Get-ChildItem "$env:TEMP\mongodb" -Recurse -Filter mongod.exe | Select-Object -First 1).FullName target/installer-input/mongod.exe

      - name: Prepare jpackage input
        shell: bash
        run: |
          cp target/desktop-pos-*.jar target/installer-input/
          cp ../backend-pos/target/backend-pos-*.jar target/installer-input/
          mkdir -p ../dist

      - name: Ensure WiX Toolset on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix314 = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          $wix311 = 'C:\Program Files (x86)\WiX Toolset v3.11\bin'
          if (Test-Path $wix314) { Add-Content $env:GITHUB_PATH $wix314 }
          elseif (Test-Path $wix311) { Add-Content $env:GITHUB_PATH $wix311 }
          else { Write-Host 'WiX not found at standard paths, relying on preinstalled PATH'; Get-Command candle.exe -ErrorAction SilentlyContinue | Format-List }

      - name: Build native installer
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          # Default for manual runs (branch name, not a version tag).
          if [[ ! "$RAW" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            RAW="1.0.0"
          fi
          # macOS jpackage rejects a leading zero (CFBundleVersion requires
          # the first integer to be > 0), so map 0.x.y -> 1.x.y.
          if [[ "$RAW" == 0* ]]; then
            RAW="1${RAW#0}"
          fi
          echo "Using app-version $RAW (from ref $GITHUB_REF_NAME)"
          # jpackage strips bin/java from the runtime image it generates, but
          # StandalonePosLauncher needs it to boot the bundled backend, so
          # build the runtime ourselves with jlink (keeps the java launcher)
          # using the same module set jpackage resolves for this app.
          RUNTIME_ARGS=()
          if [[ -d "$JAVA_HOME/jmods" ]]; then
            MODS="java.base java.compiler java.datatransfer java.xml java.prefs java.desktop java.instrument java.logging java.management java.security.sasl java.naming java.rmi java.management.rmi java.net.http java.scripting java.security.jgss java.smartcardio java.transaction.xa java.sql java.sql.rowset java.xml.crypto jdk.accessibility jdk.attach jdk.compiler jdk.dynalink jdk.httpserver jdk.incubator.vector jdk.jartool jdk.jdwp.agent jdk.management jdk.management.agent jdk.management.jfr jdk.net jdk.nio.mapmode jdk.sctp jdk.security.auth jdk.security.jgss jdk.unsupported jdk.unsupported.desktop jdk.xml.dom jdk.zipfs"
            "$JAVA_HOME/bin/jlink" --output target/java-runtime \
              --module-path "$JAVA_HOME/jmods" \
              --add-modules "${MODS// /,}" \
              --strip-debug --no-header-files --no-man-pages
            RUNTIME_ARGS=(--runtime-image target/java-runtime)
          else
            echo "No jmods in JAVA_HOME, falling back to jpackage default runtime"
          fi
          # Professional Windows wizard (exe only): directory chooser, license
          # page, Start Menu + Desktop shortcuts, stable upgrade UUID so
          # v1 -> v2 upgrades replace instead of installing side-by-side.
          # Per-machine install (Program Files, UAC prompt) is intentional
          # for a shared café till. These flags are Windows-only and must
          # stay out of the Linux/macOS jpackage calls.
          WIN_ARGS=()
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            WIN_ARGS=(
              --win-dir-chooser
              --win-menu
              --win-menu-group "POS Tunisie"
              --win-shortcut
              --win-shortcut-prompt
              --win-upgrade-uuid "e8b6f0a2-7c4d-4f8e-b3a1-9d2c5e6f7a8b"
              --win-help-url "https://github.com/aminammar1/tunisian-restaurant-coffee-pos"
            )
          fi
          jpackage \
            --type "${{ matrix.type }}" \
            --name POS-Tunisie \
            --app-version "$RAW" \
            --vendor "Mohamed Amine Ammar" \
            --copyright "Copyright (c) 2026 Mohamed Amine Ammar" \
            --description "POS Tunisie cafe and restaurant point of sale" \
            --license-file ../LICENSE \
            --input target/installer-input \
            --main-jar "$(basename target/desktop-pos-*.jar)" \
            --main-class tn.cafe.pos.desktop.StandalonePosLauncher \
            --icon "${{ matrix.icon }}" \
            --dest ../dist \
            "${RUNTIME_ARGS[@]}" \
            "${WIN_ARGS[@]}" \
            --java-options "--enable-native-access=ALL-UNNAMED"
          # Portable Linux folder (for Arch and other non-deb distros):
          # jpackage app-image needs no dpkg/rpm, runs anywhere with the
          # bundled runtime. Pack it as tar.gz alongside the .deb.
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            jpackage \
              --type app-image \
              --name POS-Tunisie \
              --app-version "$RAW" \
              --vendor "Mohamed Amine Ammar" \
              --copyright "Copyright (c) 2026 Mohamed Amine Ammar" \
              --description "POS Tunisie cafe and restaurant point of sale" \
              --license-file ../LICENSE \
              --input target/installer-input \
              --main-jar "$(basename target/desktop-pos-*.jar)" \
              --main-class tn.cafe.pos.desktop.StandalonePosLauncher \
              --icon "${{ matrix.icon }}" \
              --dest ../dist-portable \
              "${RUNTIME_ARGS[@]}" \
              --java-options "--enable-native-access=ALL-UNNAMED"
            tar -czf "../dist/POS-Tunisie-${RAW}-linux-portable.tar.gz" -C ../dist-portable POS-Tunisie
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
